services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-haregi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-haregi}
      POSTGRES_USER: ${POSTGRES_USER:-haregi}
    ports:
      # ループバックのみに公開する（既定の "5432:5432" はホストの全インターフェースへ公開されるため）
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-haregi} -d ${POSTGRES_DB:-haregi}"
        ]
      interval: 2s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  postgres-data:
