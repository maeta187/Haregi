<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>ログイン — Haregi</title>
    <link rel="stylesheet" href="./styles.css" />
    <link rel="stylesheet" href="./screens.css" />
    <script src="./theme.js"></script>
  </head>
  <body>
    <svg width="0" height="0" class="sr-only" aria-hidden="true" focusable="false">
      <symbol id="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <circle cx="12" cy="12" r="4" />
        <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
      </symbol>
    </svg>

    <header class="header">
      <div class="container header__inner">
        <a class="logo" href="./index.html">
          <span class="logo__mark" aria-hidden="true">
            <svg width="16" height="16"><use href="#i-sun" /></svg>
          </span>
          Haregi
        </a>
        <div class="header__spacer"></div>
        <button class="btn btn--ghost btn--sm theme-toggle" type="button" data-theme-toggle aria-label="ライト / ダークを切り替える" title="ライト / ダークを切り替える">
          <svg class="theme-toggle__sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
            <circle cx="12" cy="12" r="4" />
            <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
          </svg>
          <svg class="theme-toggle__moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5Z" />
          </svg>
        </button>
        <a class="btn btn--ghost btn--sm" href="./signup.html">新規登録</a>
      </div>
    </header>

    <main class="main">
      <div class="container">
        <p class="mock-note">
          モック: <code>/login</code>。未ログインで保護ルート(<code>/forecast</code> 等)へアクセスしたときの
          リダイレクト着地点も兼ねる(上部の案内)。パスワードリセットは Should(一般公開前は必須)のため、
          <strong>限定公開の初回リリースではリンクを出さない</strong>想定(spec §2.1 / §6)。
        </p>

        <div class="auth">
          <div class="alert" style="margin-bottom: 16px">
            <div class="alert__body">
              <span class="alert__title">ログインが必要です</span>
              <p>「予報とコーデ」を開くにはログインしてください。</p>
            </div>
          </div>

          <div class="card">
            <div class="card__header">
              <div>
                <h1 class="card__title">ログイン</h1>
                <p class="card__desc">登録したメールアドレスとパスワードを入力してください。</p>
              </div>
            </div>
            <div class="card__body">
              <div class="field">
                <label class="label" for="email">メールアドレス<span class="req">必須</span></label>
                <input class="input" id="email" type="email" value="admin@example.com" />
              </div>

              <div class="field">
                <label class="label" for="password">パスワード<span class="req">必須</span></label>
                <input class="input" id="password" type="password" value="password123" />
              </div>

              <div style="margin-top: 22px">
                <a class="btn btn--block btn--lg" href="./forecast.html">ログイン</a>
              </div>
            </div>
          </div>

          <p class="auth__foot">
            アカウントをお持ちでないですか? <a href="./signup.html">新規登録</a>
          </p>
        </div>
      </div>
    </main>

    <footer class="footer">
      <div class="container footer__inner">
        <span class="footer__source">出典: 気象庁ホームページ</span>
        <span class="header__spacer"></span>
        <span>© 2026 Haregi</span>
      </div>
    </footer>
  </body>
</html>
