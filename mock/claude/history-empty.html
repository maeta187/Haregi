<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>コーデ履歴(記録なし) — Haregi</title>
    <link rel="stylesheet" href="./styles.css" />
    <link rel="stylesheet" href="./screens.css" />
    <script src="./theme.js"></script>
  </head>
  <body>
    <svg width="0" height="0" class="sr-only" aria-hidden="true" focusable="false">
      <symbol id="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <circle cx="12" cy="12" r="4" />
        <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
      </symbol>
      <symbol id="i-menu" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <path d="M4 6h16M4 12h16M4 18h16" />
      </symbol>
    </svg>

    <header class="header">
      <div class="container header__inner">
        <a class="logo" href="./index.html">
          <span class="logo__mark" aria-hidden="true">
            <svg width="16" height="16"><use href="#i-sun" /></svg>
          </span>
          Haregi
        </a>
        <nav class="nav">
          <a href="./forecast.html">予報とコーデ</a>
          <a href="./history.html" aria-current="page">履歴</a>
          <a href="./settings.html">設定</a>
        </nav>
        <div class="header__spacer"></div>
        <button class="btn btn--ghost btn--sm theme-toggle" type="button" data-theme-toggle aria-label="ライト / ダークを切り替える" title="ライト / ダークを切り替える">
          <svg class="theme-toggle__sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
            <circle cx="12" cy="12" r="4" />
            <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
          </svg>
          <svg class="theme-toggle__moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5Z" />
          </svg>
        </button>
        <a class="btn btn--ghost btn--sm drawer-trigger" href="./forecast-drawer.html" aria-label="メニューを開く">
          <svg width="20" height="20" aria-hidden="true"><use href="#i-menu" /></svg>
        </a>
        <div class="header__user">
          <span class="avatar" aria-hidden="true">ハ</span>
          <span>ハレギ太郎</span>
          <a class="btn btn--outline btn--sm" href="./landing.html">ログアウト</a>
        </div>
      </div>
    </header>

    <main class="main">
      <div class="container stack">
        <p class="mock-note">
          モック: <code>/history</code>(<strong>記録が0件のときの空状態</strong>)。
          保存した記録を後から見る唯一の手段のため、空のときは <code>/forecast</code> への導線を出す。
        </p>

        <div class="page-head">
          <div>
            <h1>コーデ履歴</h1>
            <p>保存した記録を新しい順に直近30件まで表示しています。</p>
          </div>
        </div>

        <section class="card">
          <div class="empty-state">
            <span class="empty-state__icon" aria-hidden="true">
              <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M4 7h16M4 12h16M4 17h10" />
              </svg>
            </span>
            <h2>まだ記録がありません</h2>
            <p>予報を見ながら今週のコーデを入力すると、その日の気温と一緒にここに残ります。</p>
            <a class="btn" href="./forecast.html">今週のコーデを入力する</a>
          </div>
        </section>

        <p class="hint">記録は保存した順ではなく、日付の新しい順に並びます。</p>
      </div>
    </main>

    <footer class="footer">
      <div class="container footer__inner">
        <span class="footer__source">出典: 気象庁ホームページ</span>
        <span>気温は記録した時点の予報(地域の代表アメダス地点)です。</span>
        <span class="header__spacer"></span>
        <span>© 2026 Haregi</span>
      </div>
    </footer>
  </body>
</html>
